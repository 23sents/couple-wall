name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Relay address and server key are baked into the APK (set in repo Settings -> Secrets and variables -> Actions).
      RELAY_URL: ${{ vars.RELAY_URL }}
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unit tests and build
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          grep -E '^e: |FAILED|AssertionError|What went wrong|expected|Exception' -A2 build.log | head -80 | while IFS= read -r l; do echo "::error::$l"; done
      - run: cp app/build/outputs/apk/debug/app-debug.apk couple-wall.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: couple-wall.apk
          generate_release_notes: true
      - uses: actions/upload-artifact@v4
        with:
          name: couple-wall-apk
          path: couple-wall.apk
